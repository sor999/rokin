global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8080, api-b:8080]
  - job_name: worker-go
    static_configs:
      - targets: [worker:2112]
  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
