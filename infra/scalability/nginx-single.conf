events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream scale_apis { server api:8080; }
  map $uri $sockjs_session {
    ~^/ws/[^/]+/([^/]+)/ $1;
    default $remote_addr;
  }
  upstream scale_sockjs { hash $sockjs_session consistent; server api:8080; }
  server {
    listen 8080;
    location /ws/ {
      proxy_pass http://scale_sockjs;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_next_upstream off;
      add_header X-Scale-Upstream $upstream_addr always;
    }
    location / {
      proxy_pass http://scale_apis;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_next_upstream off;
      add_header X-Scale-Upstream $upstream_addr always;
    }
  }
}
