groups:
  - name: robot-platform
    rules:
      - alert: RobotPlatformTargetDown
        expr: up{job=~"api-spring|worker-go|postgres-exporter|kafka-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} metrics target is down"
          description: "Prometheus has not scraped {{ $labels.instance }} for one minute."

      - alert: WorkerBatchFlushFailure
        expr: increase(worker_batch_flush_total{result="failure"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Worker DB batch flush is failing"
          description: "At least one Worker DB batch flush failed during the last five minutes."

      - alert: WorkerConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup!=""}) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }} consumer lag is high"
          description: "The {{ $labels.consumergroup }} consumer group has more than 1,000 pending messages."

      - alert: SpringApiServerErrors
        expr: sum(rate(http_server_requests_seconds_count{application="api-spring",status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spring API is returning server errors"
          description: "The API has continuously returned HTTP 5xx responses for two minutes."
