groups:
  - name: worker-backpressure
    rules:
      - alert: WorkerPartitionPaused
        expr: worker_pending{kind="paused_partitions"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Worker 소비 중지가 5분 이상 지속됨
      - alert: WorkerPartitionBlocked
        expr: worker_control_total{event="blocked"} > 0
        labels:
          severity: critical
        annotations:
          summary: 메시지 크기 또는 DLQ 한도로 파티션 수동 확인 필요
      - alert: WorkerCommitFailure
        expr: increase(worker_offset_commit_total{result="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Worker 오프셋 커밋 재시도 확인 필요
      - alert: WorkerMemoryHigh
        expr: process_resident_memory_bytes{job="worker"} > 469762048
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Worker RSS가 448MiB 초과
      - alert: WorkerLagGrowing
        expr: sum by (topic) (worker_partition_lag) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Worker 파티션 대기 이력 확인 필요
