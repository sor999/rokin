services:
  api:
    ports: !override ['127.0.0.1:18491:8080']
    environment:
      SIMULATOR_LEASE_ENABLED: 'true'
  api-b:
    ports: !override ['127.0.0.1:18492:8080']
    environment:
      SIMULATOR_LEASE_ENABLED: 'true'
  load-balancer:
    ports: !override ['127.0.0.1:18490:8080']
  runtime-api-a:
    image: nginx:1.28-alpine
    depends_on:
      load-balancer:
        condition: service_started
    volumes:
      - ./failover/runtime-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [robot_net]
  runtime-api-b:
    image: nginx:1.28-alpine
    depends_on:
      load-balancer:
        condition: service_started
    volumes:
      - ./failover/runtime-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [robot_net]
  fake_robot:
    depends_on:
      runtime-api-a:
        condition: service_started
    environment:
      SIMULATOR_API_URL: http://runtime-api-a:8080
      SIMULATOR_LEASE_ENABLED: 'true'
      ROS_DOMAIN_ID: 89
    restart: 'no'
  fake_robot-b:
    extends:
      file: docker-compose.yml
      service: fake_robot
    container_name: !reset null
    depends_on:
      runtime-api-b:
        condition: service_started
    environment:
      SIMULATOR_LEASE_ENABLED: 'true'
      ROS_DOMAIN_ID: 89
      SIMULATOR_API_URL: http://runtime-api-b:8080
    volumes: !override
      - standby_delivery_data:/var/lib/robot-delivery
    restart: 'no'
volumes:
  standby_delivery_data:
