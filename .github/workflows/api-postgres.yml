name: API PostgreSQL

on:
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - '.github/workflows/api-postgres.yml'

permissions:
  contents: read

concurrency:
  group: api-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-test:
    name: API PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rokin_test_only
          POSTGRES_DB: api_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_verification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRESENCE_TEST_URL: jdbc:postgresql://localhost:5432/api_verification
      FENCE_TEST_URL: jdbc:postgresql://localhost:5432/api_verification
      WORKER_ROLE_TEST_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: services/api/*.gradle
      - name: Test and build API with PostgreSQL
        working-directory: services/api
        run: ./gradlew test bootJar --console=plain
