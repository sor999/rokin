spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  sql:
    init:
      schema-locations: classpath:db/migration/V4__add_simulation_registry.sql

  kafka:
    bootstrap-servers: localhost:9092
