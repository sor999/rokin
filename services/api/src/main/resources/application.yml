server:
  port: 8080
  tomcat:
    connection-timeout: 5s

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telemetry}?connectTimeout=2&socketTimeout=2&cancelSignalTimeout=1
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    postgresql:
      transactional-lock: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL:localhost:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 파티션 선택 전략 명시: 키(robotId) 기반으로 결정하여 같은 로봇의 순서를 보장
      properties:
        partitioner.class: org.apache.kafka.clients.producer.internals.DefaultPartitioner

fleet:
  realtime:
    enabled: ${REALTIME_RELAY_ENABLED:false}
    host: ${REALTIME_REDIS_HOST:localhost}
    port: ${REALTIME_REDIS_PORT:6379}
    password: ${REALTIME_REDIS_PASSWORD:}
  id: ${FLEET_ID:default}
  websocket:
    preserve-receive-order: ${WEBSOCKET_PRESERVE_RECEIVE_ORDER:false}
  offline-threshold-seconds: 30
  offline-check-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,realtime
  metrics:
    tags:
      application: api-spring
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.robot.fleet: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: ERROR

simulation:
  internal-token: ${SIMULATOR_INTERNAL_TOKEN:}
  max-robots: ${SIMULATOR_MAX_ROBOTS:20}
